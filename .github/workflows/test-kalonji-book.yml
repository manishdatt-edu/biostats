name: Test Kalonji book render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Make Kalonji-Book executable
        run: chmod +x ./Kalonji-Book

      - name: Render book
        run: ./Kalonji-Book render --book-dir _kalonji_build _quarto.yml --verbose

      - name: Upload rendered site for inspection
        uses: actions/upload-artifact@v7
        with:
          name: kalonji-book-site
          path: _kalonji_build/_site
          if-no-files-found: error
          retention-days: 14
